# ---------------------------------------------------------------------------
# nginx -> php-fpm for a Laravel API.
#
# OWASP A02 / A05: the fastcgi block below is written the safe way round.
# The classic vulnerable form is a bare "location ~ \.php$" that forwards any
# path ending in .php to PHP; combined with an upload directory that is served
# by this server, that is remote code execution. try_files ... =404 and the
# explicit SCRIPT_FILENAME are what close it.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Do not advertise the nginx version on error pages or in headers.
    server_tokens off;

    client_max_body_size 12M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Static assets (the scaffold's public/vendor/cachewraith/app.css, your
    # build output) are served by nginx and never reach the PHP middleware
    # stack, so SecurityHeaders never sees them. Set the sniffing guard here
    # as well (OWASP A02).
    add_header X-Content-Type-Options "nosniff" always;

    # Real errors go to the log; the client gets Laravel's JSON envelope.
    error_log /dev/stderr warn;
    access_log /dev/stdout;

    # Everything is a front-controller request. There is no directory listing
    # and no direct file execution outside public/index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only ever pass a request to PHP when the script really exists on disk.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;

        internal;
    }

    # Any other .php path is a probe, not a route.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles are never served: .env, .git/config and .htaccess are the three
    # most-scanned paths on the internet.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
}
