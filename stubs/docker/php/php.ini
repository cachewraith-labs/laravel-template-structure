; ---------------------------------------------------------------------------
; Application PHP settings, loaded as conf.d/99-app.ini.
;
; OWASP A02 (Security Misconfiguration): the defaults that matter are the ones
; that stop the runtime from talking about itself.
; ---------------------------------------------------------------------------

; Do not advertise the PHP version in the Server / X-Powered-By header.
expose_php = Off

; Errors go to the log, never to the response. A rendered stack trace leaks
; absolute paths, SQL fragments and environment values (A02 / A10). Laravel's
; own APP_DEBUG must also be false in production.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

memory_limit = 256M
max_execution_time = 30

; Upload limits are a denial-of-service control, not a convenience setting.
post_max_size = 12M
upload_max_filesize = 10M
max_input_vars = 2000

date.timezone = UTC

; --- Sessions (only relevant if you serve cookie sessions alongside the API)
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; --- Opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Never re-stat files in a production image: the code cannot change without a
; new container.
opcache.validate_timestamps = 0

; A05: the parser must not treat a bare "<?" as an open tag.
short_open_tag = Off
